name: "Feature request [Unstructured]"
description: "Free-form feature request template"
title: "<title>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Use the template below as a guide. Fill in the sections that are relevant to your request.
        Fields marked with * are recommended but not enforced.

  - type: textarea
    id: content
    attributes:
      label: Feature Description
      description: |
        Describe your feature request using the suggested structure below.
        Feel free to modify or skip sections that aren't relevant.
      placeholder: |
        ### Brief summary *
        [Describe the feature in 1-2 sentences]

        ### User story *
        As a [role], I want [feature] so that [benefit]

        ### Context / Problem *
        [What problem does this solve?]

        ### In scope *
        - [What's included]
        - 

        ### Out of scope
        - [What's explicitly NOT included]
        - 

        ### Proposed approach / Implementation notes
        - [Technical suggestions if any]
        - 

        ### UX/UI links
        - [Figma/design links if available]

        ### Dependencies
        - [Other features/systems this depends on]

        ### Risks & constraints
        - [Potential issues to consider]

        ### Acceptance criteria *
        - [ ] Criteria 1
        - [ ] Criteria 2

        ### Definition of Done *
        - [ ] UX/UI review approved
        - [ ] Code review approved (≥1 approver)
        - [ ] Documentation updated (README / ADR / API)
        - [ ] Release notes prepared
        - [ ] Successfully tested in Staging
        - [ ] Rollout plan defined (and rollback plan if needed)

        ### Test plan
        - [How to test this feature]

        ### Success metrics / Impact
        - [How will we measure success?]

        ### Rollout / Release plan
        - [Deployment strategy]

        ### Links & related issues
        - [Related issues/PRs]

        ### Additional notes
        [Anything else]
    validations:
      required: true
